name: CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.19.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.17.0"
          cache: pnpm

      - name: Install Python quality dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Python lint
        run: python -m nox -s lint

      - name: Python typecheck
        run: python -m nox -s typecheck

      - name: Python unit and contract tests
        run: python -m nox -s unit contract

      - name: Web lint
        run: pnpm --filter @flopbench/web lint

      - name: Web typecheck
        run: pnpm --filter @flopbench/web typecheck

      - name: Web tests
        run: pnpm --filter @flopbench/web test

      - name: Build Python and web artifacts
        run: |
          python -m nox -s build
          pnpm --filter @flopbench/web build
