name: CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.19.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"
          cache: pnpm

      - name: Install Python quality dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Python lint
        run: python -m nox -s lint

      - name: Python typecheck
        run: python -m nox -s typecheck

      - name: Documentation and example integrity
        run: python -m nox -s docs

      - name: Python unit, contract and security tests
        run: python -m nox -s unit contract security

      - name: Web lint
        run: pnpm --filter @flopbench/web lint

      - name: Web typecheck
        run: pnpm --filter @flopbench/web typecheck

      - name: Web tests
        run: pnpm --filter @flopbench/web test

      - name: Build Python artifacts
        run: python -m nox -s build

      - name: Build web artifacts
        run: pnpm --filter @flopbench/web build

      - name: Clean install and safe uninstall
        run: python -m nox -s install

      - name: Install Chromium (Ubuntu)
        if: runner.os == 'Linux'
        run: pnpm --filter @flopbench/web exec playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @flopbench/web exec playwright install chromium

      - name: Dashboard E2E and accessibility
        run: pnpm --filter @flopbench/web e2e

  release-candidate:
    name: Release candidate integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.19.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"
          cache: pnpm

      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency and secret audit
        run: python -m nox -s audit

      - name: Build and verify release-candidate artifacts
        run: python -m nox -s release -- dist/release

      - name: Upload verified release-candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flopbench-release-candidate
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
