name: Stable release

on:
  push:
    tags:
      - "v1.0.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.19.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.17.0"
          cache: pnpm

      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate stable tag and documentation
        run: python scripts/verify_release_tag.py "$GITHUB_REF_NAME"

      - name: Require the tagged commit to belong to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Documentation, examples, dependencies, and secrets
        run: python -m nox -s docs audit

      - name: Build and verify release artifacts
        run: python -m nox -s release -- dist/release

      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/release/*
          --draft --verify-tag --title "FlopBench $GITHUB_REF_NAME"
          --notes-file docs/releases/v1.0.0.md

      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "dist/release/*"

      - name: Publish attested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
